# ===========================================
# DJSH Finance App - Docker Swarm Stack Configuration
# For production deployment with load balancing and fault tolerance
# Security hardened with secrets, read-only FS, and capability drops
#
# Usage:
#   1. Initialize swarm: docker swarm init
#   2. Generate env: node scripts/docker-setup.js --swarm
#   3. Build and push images: docker compose build && docker compose push
#   4. Deploy stack: docker stack deploy -c docker-compose.swarm.yml djsh
#
# Configuration is read from .env (generated from config.json)
# ===========================================

version: "3.9"

services:
  # ===========================================
  # MySQL 8.0 Database (Single Instance - Stateful)
  # ===========================================
  mysql:
    image: mysql:8.0
    hostname: ${MYSQL_CONTAINER:-djsh-mysql}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${DB_NAME:-djsh_finance_db}
      MYSQL_USER: ${DB_USER:-djsh_user}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/001_add_users_table.sql:/docker-entrypoint-initdb.d/02-users.sql:ro
    networks:
      djsh-overlay:
        aliases:
          - mysql
          - ${MYSQL_CONTAINER:-djsh-mysql}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================
  # Express.js Backend API (Load Balanced)
  # ===========================================
  backend:
    image: ${REGISTRY_URL:-127.0.0.1:5000}/djsh-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    hostname: djsh-backend-{{.Task.Slot}}
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-8080}
      HOST: 0.0.0.0
      DB_HOST: ${MYSQL_CONTAINER:-djsh-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-djsh_finance_db}
      DB_USER: ${DB_USER:-djsh_user}
      FRONTEND_URL: ${CORS_ORIGINS:-http://localhost:3000}
      DB_PASSWORD_FILE: /run/secrets/mysql_password
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
    secrets:
      - mysql_password
      - jwt_access_secret
      - jwt_refresh_secret
    configs:
      - source: app_config
        target: /app/config.json
        mode: 0444
    # Security: read-only filesystem with tmpfs for temporary files
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    ports:
      - target: ${BACKEND_PORT:-8080}
        published: ${BACKEND_PORT_EXTERNAL:-8080}
        protocol: tcp
        mode: ingress
    networks:
      djsh-overlay:
        aliases:
          - backend
          - ${BACKEND_CONTAINER:-djsh-backend}
    deploy:
      mode: replicated
      replicas: ${BACKEND_REPLICAS:-2}
      endpoint_mode: vip
      labels:
        - "traefik.enable=true"
        - "app.service=backend"
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
        monitor: 30s
        max_failure_ratio: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-1}
          memory: ${BACKEND_MEM_LIMIT:-512M}
        reservations:
          cpus: ${BACKEND_CPU_RESERVE:-0.25}
          memory: ${BACKEND_MEM_RESERVE:-128M}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${BACKEND_PORT:-8080}/lookups/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ===========================================
  # Next.js Frontend (Load Balanced)
  # ===========================================
  frontend:
    image: ${REGISTRY_URL:-127.0.0.1:5000}/djsh-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    hostname: djsh-frontend-{{.Task.Slot}}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${FRONTEND_PORT:-3000}
      INTERNAL_API_URL: http://backend:${BACKEND_PORT:-8080}
    # Security: read-only filesystem with tmpfs for cache
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /app/.next/cache:mode=1777,size=128M
    ports:
      - target: ${FRONTEND_PORT:-3000}
        published: ${FRONTEND_PORT_EXTERNAL:-3000}
        protocol: tcp
        mode: ingress
    networks:
      djsh-overlay:
        aliases:
          - frontend
          - ${FRONTEND_CONTAINER:-djsh-frontend}
    deploy:
      mode: replicated
      replicas: ${FRONTEND_REPLICAS:-2}
      endpoint_mode: vip
      labels:
        - "traefik.enable=true"
        - "app.service=frontend"
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
        monitor: 30s
        max_failure_ratio: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: ${FRONTEND_CPU_LIMIT:-1}
          memory: ${FRONTEND_MEM_LIMIT:-512M}
        reservations:
          cpus: ${FRONTEND_CPU_RESERVE:-0.25}
          memory: ${FRONTEND_MEM_RESERVE:-128M}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${FRONTEND_PORT:-3000}/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ===========================================
  # Local Docker Registry (for image distribution)
  # Only needed if using local registry
  # ===========================================
  registry:
    image: registry:2
    ports:
      - "${EXTERNAL_HOST:-0.0.0.0}:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      djsh-overlay:
        aliases:
          - registry
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    profiles:
      - registry

# ===========================================
# Secrets - Sensitive data stored securely
# ===========================================
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  jwt_access_secret:
    file: ./secrets/jwt_access_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt

# ===========================================
# Configs - Managed configuration files
# ===========================================
configs:
  app_config:
    file: ./config.json

# ===========================================
# Networks - Overlay for multi-host communication
# ===========================================
networks:
  djsh-overlay:
    driver: overlay
    name: ${DOCKER_NETWORK:-djsh-network}
    attachable: true
    ipam:
      driver: default

# ===========================================
# Volumes - Persistent storage
# ===========================================
volumes:
  mysql-data:
    name: ${MYSQL_VOLUME:-djsh-mysql-data}
  registry-data:
    name: djsh-registry-data
